name: Build iOS App (.ipa)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.2'

      - name: Build iOS App (.app)
        run: |
          xcodebuild -project ThePetStation.xcodeproj \
                     -scheme ThePetStation \
                     -destination 'generic/platform=iOS' \
                     -configuration Release \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/ThePetStation.app Payload/
          zip -r ThePetStation.ipa Payload

      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThePetStation-iOS-App
          path: ThePetStation.ipa
