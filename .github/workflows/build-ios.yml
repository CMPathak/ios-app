name: Build iOS App (.ipa & .zip)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Available Simulators
        run: |
          xcodebuild -version

      - name: Build iOS App (.app)
        run: |
          xcodebuild build \
            -project ThePetStation.xcodeproj \
            -scheme ThePetStation \
            -destination 'platform=iOS Simulator,name=iPhone 15 Pro' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" 2>&1 | tee build_log.txt || { echo "=== XCODEBUILD LOG ERRORS ==="; grep -i "error:" build_log.txt || tail -n 50 build_log.txt; exit 1; }

      - name: Package for Appetize.io (Zip)
        run: |
          APP_PATH=$(find build/Build/Products -name "ThePetStation.app" | head -n 1)
          echo "Found App at: $APP_PATH"
          cd "$(dirname "$APP_PATH")"
          zip -r "$GITHUB_WORKSPACE/ThePetStation-Appetize.zip" "ThePetStation.app"

      - name: Package .ipa for Physical Devices
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/Build/Products -name "ThePetStation.app" | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -r ThePetStation.ipa Payload

      - name: Upload Appetize.io Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThePetStation-Appetize-Simulator-Zip
          path: ThePetStation-Appetize.zip

      - name: Upload .ipa Device Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThePetStation-iOS-Device-IPA
          path: ThePetStation.ipa
