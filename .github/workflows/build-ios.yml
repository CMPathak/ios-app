name: Build Complete Physical iPhone Device IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-device-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Compile and Link Full Executable Binary
        run: |
          xcodebuild build \
            -project ThePetStation.xcodeproj \
            -scheme ThePetStation \
            -destination 'platform=iOS Simulator,name=iPhone 15 Pro' \
            -configuration Release \
            -derivedDataPath build \
            ONLY_ACTIVE_ARCH=NO \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" 2>&1 | tee build_log.txt || { echo "=== XCODEBUILD LOG ERRORS ==="; grep -i "error:" build_log.txt || tail -n 50 build_log.txt; exit 1; }

      - name: Package Complete Physical Device IPA with Executable
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/Build/Products -name "ThePetStation.app" | head -n 1)
          echo "Found compiled app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/

          # Configure Info.plist for iPhoneOS physical device target
          plutil -replace CFBundleSupportedPlatforms -json '["iPhoneOS"]' Payload/ThePetStation.app/Info.plist
          plutil -replace DTPlatformName -string "iphoneos" Payload/ThePetStation.app/Info.plist

          echo "=== PAYLOAD CONTENTS VERIFICATION ==="
          ls -la Payload/ThePetStation.app/

          zip -r ThePetStation-Device.ipa Payload

      - name: Upload Complete Physical Device .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThePetStation-Physical-iPhone-Complete-IPA
          path: ThePetStation-Device.ipa
