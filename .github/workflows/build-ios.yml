name: Build Universal iOS App (.ipa & .zip)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Build Universal iOS App (.app)
        run: |
          xcodebuild build \
            -project ThePetStation.xcodeproj \
            -scheme ThePetStation \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release \
            -derivedDataPath build \
            ARCHS="x86_64 arm64" \
            ONLY_ACTIVE_ARCH=NO \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" 2>&1 | tee build_log.txt || { echo "=== XCODEBUILD LOG ERRORS ==="; grep -i "error:" build_log.txt || tail -n 50 build_log.txt; exit 1; }

      - name: Locate App
        id: locate
        run: |
          APP_PATH=$(find build/Build/Products -name "ThePetStation.app" | head -n 1)
          echo "APP_PATH=$APP_PATH" >> $GITHUB_OUTPUT
          echo "Found App at: $APP_PATH"

      - name: Package .ipa for Physical Devices
        run: |
          mkdir -p Payload
          cp -r "${{ steps.locate.outputs.APP_PATH }}" Payload/
          zip -r ThePetStation.ipa Payload

      - name: Upload Appetize.io App Folder Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThePetStation.app
          path: ${{ steps.locate.outputs.APP_PATH }}

      - name: Upload .ipa Device Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThePetStation-iOS-Device-IPA
          path: ThePetStation.ipa
