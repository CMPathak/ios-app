name: Build Complete Physical iPhone Device IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-device-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Build & Archive Physical iPhone App (.app)
        run: |
          xcodebuild archive \
            -project ThePetStation.xcodeproj \
            -scheme ThePetStation \
            -sdk iphoneos \
            -archivePath build/ThePetStation.xcarchive \
            -configuration Release \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Complete Physical Device .ipa
        run: |
          mkdir -p Payload
          cp -r build/ThePetStation.xcarchive/Products/Applications/ThePetStation.app Payload/

          echo "=== PAYLOAD CONTENTS VERIFICATION ==="
          ls -la Payload/ThePetStation.app/

          zip -r ThePetStation-Device.ipa Payload

      - name: Upload Complete Physical Device .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThePetStation-Physical-iPhone-Complete-IPA
          path: ThePetStation-Device.ipa
