name: Build Physical iPhone Device IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-device-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Build Physical iPhone App (.app for iphoneos)
        run: |
          xcodebuild build \
            -project ThePetStation.xcodeproj \
            -scheme ThePetStation \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            ARCHS="arm64" \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package Physical Device .ipa
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "ThePetStation.app" | head -n 1)
          echo "Found Physical Device App at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r ThePetStation-Device.ipa Payload

      - name: Upload Physical Device .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThePetStation-Physical-iPhone-IPA
          path: ThePetStation-Device.ipa
