name: Build Unsigned Physical Device IPA for Sideloadly

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-unsigned-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.2.app

      - name: Show Xcode & SDK Info
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build Unsigned Physical iPhone Binary (-sdk iphoneos)
        run: |
          xcodebuild build \
            -project ThePetStation.xcodeproj \
            -scheme ThePetStation \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" 2>&1 | tee build_log.txt || { echo "=== BUILD FAILED ==="; tail -n 50 build_log.txt; exit 1; }

      - name: Package Physical Device IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/Build/Products -name "ThePetStation.app" | head -n 1)
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/

          # Update Info.plist for iPhoneOS physical device
          plutil -replace CFBundleSupportedPlatforms -json '["iPhoneOS"]' Payload/ThePetStation.app/Info.plist
          plutil -replace DTPlatformName -string "iphoneos" Payload/ThePetStation.app/Info.plist

          echo "=== PAYLOAD CONTENTS ==="
          ls -la Payload/ThePetStation.app/

          echo "=== VERIFYING EXECUTABLE ARCHITECTURE ==="
          file Payload/ThePetStation.app/ThePetStation
          lipo -info Payload/ThePetStation.app/ThePetStation

          zip -r ThePetStation-Sideloadly.ipa Payload

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThePetStation-Sideloadly-IPA
          path: ThePetStation-Sideloadly.ipa
